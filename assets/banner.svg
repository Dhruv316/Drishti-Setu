<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="DrishtiSetu banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12314F"/>
      <stop offset="1" stop-color="#0B2238"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14908A"/>
      <stop offset="1" stop-color="#0F6F6A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14908A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14908A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="930" cy="170" r="230" fill="url(#glow)"/>

  <!-- Eye + bridge motif -->
  <g transform="translate(930 170)">
    <path d="M-190 0 Q0 -140 190 0 Q0 140 -190 0 Z" fill="none" stroke="#F4F1EA" stroke-opacity="0.9" stroke-width="3"/>
    <circle r="82" fill="url(#iris)" stroke="#F4F1EA" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="82" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="10" stroke-dasharray="2 10"/>
    <circle r="34" fill="#0B2238"/>
    <circle cx="-18" cy="-20" r="10" fill="#FFFFFF" fill-opacity="0.85"/>
    <!-- bridge arch across the pupil -->
    <path d="M-70 40 Q0 -30 70 40" fill="none" stroke="#C1652F" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#C1652F" stroke-width="2.5" stroke-linecap="round">
      <line x1="-45" y1="24" x2="-45" y2="42"/>
      <line x1="-22" y1="8" x2="-22" y2="36"/>
      <line x1="0" y1="2" x2="0" y2="34"/>
      <line x1="22" y1="8" x2="22" y2="36"/>
      <line x1="45" y1="24" x2="45" y2="42"/>
    </g>
    <line x1="-84" y1="42" x2="84" y2="42" stroke="#C1652F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="70" y="70" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="6" fill="#14908A" font-weight="700">SMART INDIA HACKATHON · TEAM DEBUG DEMONS</text>
  <text x="70" y="160" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="88" fill="#FFFFFF" font-weight="600">DrishtiSetu</text>
  <text x="70" y="212" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="34" fill="#F4F1EA" fill-opacity="0.85">दृष्टिसेतु</text>
  <text x="70" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#F4F1EA" fill-opacity="0.9">Explainable AI for Diabetic Retinopathy Screening in Rural India</text>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="70" y="285" width="118" height="28" rx="14" fill="#0F6F6A"/>
    <text x="129" y="304" text-anchor="middle" fill="#FFFFFF">Explainable</text>
    <rect x="198" y="285" width="118" height="28" rx="14" fill="#3F7D5C"/>
    <text x="257" y="304" text-anchor="middle" fill="#FFFFFF">Edge-first</text>
    <rect x="326" y="285" width="138" height="28" rx="14" fill="#C1652F"/>
    <text x="395" y="304" text-anchor="middle" fill="#FFFFFF">Human-in-loop</text>
  </g>
</svg>
